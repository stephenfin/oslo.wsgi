[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "oslo.web"
description = "Oslo Web library"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache-2.0"}
dynamic = ["version"]
dependencies = [
]
requires-python = ">=3.11"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[dependency-groups]
doc = [
    "openstackdocstheme>=3.6.0", # Apache-2.0
    "reno>=4.0.0", # Apache-2.0
    "sphinx>=8.0.0", # BSD
]
test = [
    "stestr>=4.0.0", # Apache-2.0
]
typing = [
    "mypy", # MIT
]

[project.urls]
Homepage = "https://docs.openstack.org/oslo.web"
Repository = "https://opendev.org/openstack/oslo.web/"

[tool.setuptools.packages.find]
include = ["oslo_web*"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "G", "LOG", "S", "UP", "W"]
